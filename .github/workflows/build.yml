name: Build Windows EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install customtkinter psycopg2-binary pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all psycopg2 --name Calculating gui.app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Calculating-Windows
          path: dist/Calculating.exe
